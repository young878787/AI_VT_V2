name: backend-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHAT_AI_API_KEY: ci-placeholder
      CHAT_AI_BASE_URL: http://127.0.0.1:9/v1
      CHAT_AI_MODEL: ci-placeholder
      JEV_AI_API_KEY: ci-placeholder
      JEV_AI_BASE_URL: http://127.0.0.1:9/v1
      JEV_AI_MODEL: ci-placeholder
      PYTHONPATH: backend
      PYTHON_DOTENV_DISABLED: '1'
      ASR_ENABLED: 'false'
      TTS_ENABLED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install ruff==0.16.10

      - name: Ruff
        run: ruff check backend

      - name: Backend unit tests
        env:
          AI_VT_MEMORY_DIR: ${{ runner.temp }}/ai-vt-memory
        run: python -m unittest discover -s backend/tests -p 'test_*.py'
