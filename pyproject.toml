[project]
name = "ai-vt-v2"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "openai",
    "httpx",
    "python-dotenv",
    "tiktoken",
    "python-multipart",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.4,<1",
    "alembic>=1.15,<2",
    "sqlalchemy>=2,<3",
    "numpy>=1.26",
    "sherpa-onnx>=1.12",
    "sherpa-onnx-core>=1.12",
    "piper-tts[zh]",
    "pillow>=11.2.1",
    "psutil>=7",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
]

[tool.uv]
# This repository is an application, not an installable Python package.
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E402 is intentional in test/tool entrypoints that add backend/ to sys.path
# before importing the application modules. The compact fixture forms below
# are existing test-harness conventions and are kept out of the first gate.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["E402"]
"backend/tools/import_legacy_memory.py" = ["E402"]
"backend/tests/test_chat_test_modes.py" = ["E701", "E702"]
"backend/tests/test_memory_test_evidence.py" = ["E701", "E702"]
"backend/tests/test_memory_testset.py" = ["E701", "E731"]
